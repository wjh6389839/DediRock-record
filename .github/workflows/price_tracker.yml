name: Daily VPS Price Tracker

on:
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 自动触发
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许你在 GitHub 页面手动点击运行测试

permissions:
  contents: write # 授予自动提交并推送代码的写权限

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas matplotlib

      - name: Run Tracker
        run: |
          python tracker.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.csv price_trend.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: update price history and trend chart" && git push)
