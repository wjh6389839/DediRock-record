name: Daily VPS Price Tracker

on:
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 运行
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码仓库
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装依赖包
        run: |
          pip install -r requirements.txt

      - name: 4. 执行监控与微信推送逻辑
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }} # 读取 GitHub Secret 传入脚本
        run: |
          python tracker.py

      - name: 5. 提交最新数据与图表回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.csv price_trend.png
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Update price data & trend chart [$(date +'%Y-%m-%d')]"
            git push
          else
            echo "数据未发生变化，无需提交。"
          fi
